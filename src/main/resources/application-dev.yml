server:
  port: 8080

spring:
  application:
    name: cv-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/externals-db
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate   # Use "update" for development, but "validate" for production
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  docker:
    compose:
      enabled: false

  mail:
    host: ${D_MAIL_HOST}
    port: ${D_MAIL_PORT}
    username: ${D_MAIL_USERNAME}
    password: ${D_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org:
      springframework: INFO

allowed:
  origins: http://localhost:4200

app:
  mock:
    flag: false
  ai:
    server:
      url: http://localhost:8080
  mail:
    from: ${APP_MAIL_FROM}

interview:
  token:
    expirationMillis: 86400000
    secret: OWSJytPLVnDkgwLd7NbZKaxIA63VOE+R8suNr8n7bIqvGzUvHTZLOlqX4x6fBmw6udTuBENk6plQwY+fg/5ZGw== #.env
  email:
    template:
      path: templates/interviewsInvitation.html
  baseLink: http://localhost:4200/interviews/