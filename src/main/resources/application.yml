server:
  port: 8080

spring:
  application:
    name: cv-management-system

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/externals-db
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  profiles:
    active: local

logging:
  level:
    org:
      springframework: INFO
