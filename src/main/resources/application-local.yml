server:
  port: 8080

spring:
  application:
    name: cv-management-system
  datasource:
    url: jdbc:postgresql://localhost:5432/externals-db
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  docker:
    compose:
      enabled: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    user:
      name: admin
      password: adminpassword
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V1__Create_user_and_candidate_tables.sql
        - classpath:db/migration/V2__Offers__and__interviews__tables.sql
      data-locations: classpath:db/insertion/Data.sql
      continue-on-error: false
  mail:
    host: ${L_MAIL_HOST}
    port: ${L_MAIL_PORT}
    username: ${L_MAIL_USERNAME}
    password: ${L_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


logging:
  level:
    org:
      springframework: INFO

allowed:
  origins: http://localhost:4200

app:
  mock:
    flag: true
  ai:
    server:
      url: http://localhost:8080
  mail:
    from: ${L_APP_MAIL_FROM}
  tts:
    apiKey: ${L_TTS_MODEL_API_KEY}
    modelId: ${MODEL_ID}
    voiceId: ${L_TTS_VOICE_ID}
    stability: 0.5
    similarityBoost: 0.5
    style: 0.0
    useSpeakerBoost: true
    speed: 1.0

  sharepoint:
    tenantId: ${SHAREPOINT_TENANT_ID}
    clientId: ${SHAREPOINT_CLIENT_ID}
    clientSecret: ${SHAREPOINT_CLIENT_SECRET}
    siteUrl: ${SHAREPOINT_SITE_URL}
    documentLibrary: ${SHAREPOINT_DOCUMENT_LIBRARY}

interview:
  token:
    expirationMillis: 86400000
    secret: OWSJytPLVnDkgwLd7NbZKaxIA63VOE+R8suNr8n7bIqvGzUvHTZLOlqX4x6fBmw6udTuBENk6plQwY+fg/5ZGw==
  email:
    template:
      path: templates/interviewsInvitation.html
  baseLink: http://localhost:4200/interviews/