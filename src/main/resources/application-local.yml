server:
  port: 8080

spring:
  application:
    name: cv-management-system
  datasource:
    url: jdbc:postgresql://localhost:5432/externals-db
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none  # Let Flyway handle all schema creation
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  docker:
    compose:
      enabled: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  security:
    user:
      name: admin
      password: adminpassword
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__Create_user_and_candidate_tables.sql  # Point to the migrtaion file
      data-locations: classpath:db/insertion/V1__data.sql  # Point to the insertion of data file
      continue-on-error: false

logging:
  level:
    org:
      springframework: INFO

allowed:
  origins: http://localhost:4200

app:
  mock:
    flag: true
  ai:
    server:
      url: http://localhost:8080
      