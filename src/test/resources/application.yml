server:
  port: 8080

spring:
  application:
    name: cv-management-system
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;SCHEMA=public
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  docker:
    compose:
      enabled: false
  flyway:
    enabled: false

  security:
    user:
      name: admin
      password: adminpassword
  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    org.springframework: INFO
    ma.nttdata.externals: DEBUG
    org.hibernate.SQL: DEBUG

allowed:
  origins: http://localhost:4200

app:
  mock:
    flag: true
  ai:
    server:
      url: http://mock-ai-server
